name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Lint with flake8
      run: |
        flake8 src tests

    - name: Run unit and integration tests
      run: |
        pytest -v

    - name: Verify CLI JSON config batch execution
      run: |
        storeshot --config examples/input.json --overwrite

    - name: Verify CLI flag batch execution
      run: |
        storeshot --input examples/input --output examples/output --theme antigravity --overwrite
